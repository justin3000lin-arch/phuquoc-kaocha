<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>富國島考察行程規劃</title>
<style>
:root{
--bg:#eaf6ec; --card:#ffffff; --ink:#1e3322; --muted:#5a6f5e; --line:#cfe6d1;
--accent:#3a8a4a; --accent-dark:#256b33; --accent-soft:#d9f0dd;
--clay:#a9714f; --clay-soft:#fdf3e7;
--sand:#7a9a5b; --sand-soft:#eef6e4;
--radius:10px;
}
@media (prefers-color-scheme: dark){
:root{ --bg:#122117; --card:#1c2f22; --ink:#eaf7ec; --muted:#a9c4ad; --line:#2e4a36; --accent:#7ec98a; --accent-dark:#a8e0b0; --accent-soft:#243d2a; --clay:#e0a87e; --clay-soft:#33281e; --sand:#b8d48a; --sand-soft:#26331f; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang SC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased;font-weight:400}
a{color:var(--accent-dark)}
button{min-height:44px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 96px}
.hero{position:relative;overflow:hidden;background:linear-gradient(165deg,#d8f2dc 0%,#eaf9ed 45%,#cdeecf 100%);color:var(--ink);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme: dark){.hero{background:linear-gradient(165deg,#1a3322,#122117 60%,#1e3d28)}}
.hero-inner{max-width:720px;margin:0 auto;padding:40px 20px 0;position:relative;z-index:2}
.hero-kicker{display:inline-block;background:rgba(255,255,255,.75);border:1px solid var(--accent);color:var(--accent-dark);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.18em;animation:kickerBounce 3s ease-in-out infinite}
@keyframes kickerBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.hero h1{font-size:32px;line-height:1.35;margin:20px 0 10px;font-weight:800;letter-spacing:.04em;animation:titleIn .8s cubic-bezier(.22,1,.36,1) both}
@keyframes titleIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.hero p.sub{margin:0;font-size:14.5px;color:var(--muted);max-width:34em;letter-spacing:.02em;animation:titleIn .8s .12s cubic-bezier(.22,1,.36,1) both}
.sun{position:absolute;right:26px;top:30px;width:56px;height:56px;border-radius:50%;background:#fff3a6;border:2px solid #f5d76e;box-shadow:0 0 0 10px rgba(255,243,166,.35),0 0 34px rgba(245,215,110,.55);animation:sunPulse 4s ease-in-out infinite,sunSpin 24s linear infinite}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes sunSpin{from{rotate:0deg}to{rotate:360deg}}
.countdown{display:flex;gap:8px;margin:24px 0 8px;flex-wrap:wrap}
.cd{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 6px;min-width:68px;text-align:center;flex:1;box-shadow:0 4px 14px rgba(37,107,51,.10);animation:cdFloat 3.6s ease-in-out infinite}
.cd:nth-child(2){animation-delay:.25s}.cd:nth-child(3){animation-delay:.5s}.cd:nth-child(4){animation-delay:.75s}
@keyframes cdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.cd b{display:block;font-size:22px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--accent-dark)}
.cd span{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.2em}
.leaf{position:absolute;font-size:20px;opacity:.75;z-index:1;animation:leafFall linear infinite;pointer-events:none}
.leaf.l1{left:8%;top:-10px;animation-duration:11s}
.leaf.l2{left:42%;top:-10px;animation-duration:14s;animation-delay:2s;font-size:16px}
.leaf.l3{left:72%;top:-10px;animation-duration:12s;animation-delay:5s;font-size:24px}
.leaf.l4{left:90%;top:-10px;animation-duration:15s;animation-delay:1s;font-size:15px}
@keyframes leafFall{0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0}8%{opacity:.8}50%{transform:translateY(190px) translateX(18px) rotate(180deg)}100%{transform:translateY(380px) translateX(-10px) rotate(340deg);opacity:0}}
.sparkle{position:absolute;color:#fff;z-index:1;animation:sparkleTwinkle 2.4s ease-in-out infinite;pointer-events:none}
@keyframes sparkleTwinkle{0%,100%{opacity:.15;transform:scale(.7) rotate(0deg)}50%{opacity:.95;transform:scale(1.25) rotate(30deg)}}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-meta span{background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--accent-dark);padding:5px 10px;border-radius:99px;font-size:12.5px;font-weight:600;letter-spacing:.04em;animation:metaPop .6s cubic-bezier(.22,1,.36,1) both}
.hero-meta span:nth-child(2){animation-delay:.12s}.hero-meta span:nth-child(3){animation-delay:.24s}
@keyframes metaPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.waves{display:block;width:100%;height:40px;margin-top:2px;position:relative;z-index:1}
.wave-path{animation:waveMove 9s linear infinite}
.wave-path2{animation:waveMove 14s linear infinite reverse;opacity:.6}
@keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.plane{position:absolute;top:14px;left:6px;font-size:17px;opacity:.55;animation:fly 18s linear infinite;z-index:2}
@keyframes fly{0%{transform:translate(0,0) rotate(6deg)}50%{transform:translate(46vw,-10px) rotate(2deg)}100%{transform:translate(88vw,4px) rotate(8deg)}}
.island-scene{margin-top:8px;position:relative}
.island-svg{display:block;width:100%;height:150px}
.scene-tag{position:absolute;left:2px;top:0;background:rgba(38,38,38,.85);color:#ffffff;font-size:11px;font-weight:600;letter-spacing:.22em;padding:4px 12px;border-radius:3px;white-space:nowrap;animation:tagFloat 4s ease-in-out infinite}
@keyframes tagFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media(max-width:480px){.island-svg{height:138px}}
.flights{display:grid;gap:12px;margin-top:20px;position:relative;z-index:3}
@media(min-width:640px){.flights{grid-template-columns:1fr 1fr}}
.flight{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.flight-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flight-top b{font-size:14.5px;font-weight:700;letter-spacing:.03em}
.badge{font-size:11.5px;font-weight:600;letter-spacing:.08em;padding:3px 9px;border-radius:3px;background:var(--accent-soft);color:var(--accent-dark)}
.badge.coral{background:var(--clay-soft);color:var(--clay)}
.route{display:flex;align-items:center;gap:10px;margin-top:12px}
.route .code{font-size:23px;font-weight:700;letter-spacing:.06em;line-height:1}
.route .city{font-size:12px;color:var(--muted);margin-top:3px}
.route .mid{flex:1;text-align:center;color:var(--muted);font-size:12px}
.route .line{height:1px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 11px);margin:5px 2px;position:relative}
.route .line::after{content:"✈";position:absolute;right:-2px;top:-10px;color:var(--accent);font-size:13px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.flight small{color:var(--muted);display:block;margin-top:10px;font-size:13px;line-height:1.7}
.weather{margin-top:20px}
.weather-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 2px 10px}
.weather-head h2{font-size:18.5px;margin:0;font-weight:700;letter-spacing:.05em}
.weather-head span{font-size:12px;color:var(--muted);letter-spacing:.03em}
.wx-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:560px){.wx-grid{grid-template-columns:repeat(2,1fr)}.wx-grid .wx-card:last-child{grid-column:1/-1}}
.wx-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px 11px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:0 2px 8px rgba(37,107,51,.06);transition:transform .25s,box-shadow .25s,border-color .25s;animation:wxIn .6s cubic-bezier(.22,1,.36,1) both}
.wx-card:nth-child(2){animation-delay:.07s}.wx-card:nth-child(3){animation-delay:.14s}.wx-card:nth-child(4){animation-delay:.21s}.wx-card:nth-child(5){animation-delay:.28s}
@keyframes wxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wx-card:active{transform:scale(.97)}
@media(hover:hover){.wx-card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(37,107,51,.13);border-color:var(--accent)}}
.wx-card small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.14em}
.wx-card .wx-icon{font-size:28px;line-height:1.25;display:block;animation:wxBob 3.4s ease-in-out infinite}
.wx-card:nth-child(even) .wx-icon{animation-delay:.6s}
@keyframes wxBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wx-card .wx-temp{display:block;font-size:17px;font-weight:800;letter-spacing:.02em;color:var(--accent-dark);font-variant-numeric:tabular-nums}
.wx-card .wx-temp i{font-style:normal;font-weight:600;color:var(--muted);font-size:13.5px}
.wx-card .wx-desc{display:block;font-size:12.5px;font-weight:600;margin-top:2px}
.wx-card .wx-rain{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:700;color:#2f6fb2;background:#e8f2fb;padding:2px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme: dark){.wx-card .wx-rain{color:#9ecdf5;background:#1d3247}}
.wx-card .wx-feel{display:block;font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.wx-note{margin:10px 2px 0;font-size:13px;color:var(--muted);line-height:1.75}
.wx-note b{color:var(--ink)}
.wx-day{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.wx-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;letter-spacing:.02em;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:4px 10px;border-radius:99px}
.wx-chip.rain{color:#2f6fb2;border-color:#bcd9f2;background:#eef6fd}
@media (prefers-color-scheme: dark){.wx-chip.rain{color:#9ecdf5;border-color:#2c4a63;background:#1d3247}}
.wx-chip.uv{color:#9a6a12;border-color:#ecd9a0;background:#fdf8e3}
@media (prefers-color-scheme: dark){.wx-chip.uv{color:#ecd28a;border-color:#5a4a22;background:#33301c}}
.daynav{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;margin:22px -20px 4px;padding-left:20px;padding-right:20px;border-bottom:1px solid var(--line)}
.daynav-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.daynav-row::-webkit-scrollbar{display:none}
.daybtn{flex:1;min-width:62px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--radius);padding:8px 4px;cursor:pointer;text-align:center;transition:all .25s;font-family:inherit}
.daybtn:active{transform:scale(.94)}
.daybtn small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.14em}
.daybtn strong{display:block;font-size:15.5px;line-height:1.3;font-weight:700;letter-spacing:.03em}
.daybtn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(58,138,74,.35);animation:dayPop .35s cubic-bezier(.22,1,.36,1)}
.daybtn.active small{color:#fff;opacity:.85}
@keyframes dayPop{0%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.progress{height:5px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;width:20%;background:linear-gradient(90deg,var(--accent),#6fce7e,var(--accent));background-size:200% 100%;border-radius:99px;transition:width .45s cubic-bezier(.22,1,.36,1);animation:progressShimmer 2s linear infinite}
@keyframes progressShimmer{from{background-position:0% 0}to{background-position:200% 0}}
.day-panel{display:none}
.day-panel.active{display:block;animation:panelIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.day-head{margin:22px 2px 4px}
.day-head h2{font-size:21px;margin:0;line-height:1.4;font-weight:700;letter-spacing:.05em}
.day-head p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.theme{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--clay);background:var(--clay-soft);padding:4px 10px;border-radius:3px}
.tl{position:relative;margin:20px 0 0;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:var(--accent);border-radius:2px;opacity:.45}
.stop{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(37,107,51,.06);transition:transform .25s,box-shadow .25s}
.stop:active{transform:scale(.99)}
@media(hover:hover){.stop:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(37,107,51,.13);border-color:var(--accent)}}
.stop::before{content:"";position:absolute;left:-22.5px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--accent);z-index:1;animation:dotPulse 2.2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(58,138,74,.35)}50%{box-shadow:0 0 0 6px rgba(58,138,74,0)}}
.stop.meal::before{border-color:var(--clay)}
.stop.stay::before{border-color:var(--sand)}
.stop-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.stop h3{margin:0;font-size:16px;line-height:1.5;font-weight:700;letter-spacing:.02em}
.time{flex-shrink:1;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--accent-dark);background:var(--accent-soft);padding:3px 8px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
@media(max-width:420px){.time{white-space:normal;line-height:1.4}}
.stop p{margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.75}
.stop .tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;background:var(--sand-soft);color:#6b5f45;padding:3px 8px;border-radius:3px;letter-spacing:.02em}
@media (prefers-color-scheme: dark){.tag{color:var(--sand)}}
.tag.gray{background:var(--accent-soft);color:var(--accent-dark)}
.reveal{opacity:1}
.reveal.in{animation:fadeUp .6s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.theme{animation:themeWiggle 4s ease-in-out infinite}
@keyframes themeWiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-1deg)}75%{transform:rotate(1deg)}}
.flight{transition:transform .25s,box-shadow .25s}
@media(hover:hover){.flight:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 12px 24px rgba(37,107,51,.14)}}
.alert{animation:alertGlow 3s ease-in-out infinite}
@keyframes alertGlow{0%,100%{box-shadow:0 0 0 0 rgba(58,138,74,0)}50%{box-shadow:0 0 0 4px rgba(58,138,74,.10)}}
.checklist li.done .box{animation:checkPop .3s cubic-bezier(.22,1,.36,1)}
@keyframes checkPop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.btn{transition:transform .2s,box-shadow .2s}
.btn:active{transform:scale(.96)}
@media(hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(37,107,51,.16)}}
.topbtn{animation:topFloat 2.8s ease-in-out infinite}
@keyframes topFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hero{background-size:140% 140%;animation:heroGlow 12s ease-in-out infinite}
@keyframes heroGlow{0%,100%{background-position:0% 40%}50%{background-position:80% 60%}}
.sun::before,.sun::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px dashed rgba(245,215,110,.55);animation:raySpin 18s linear infinite}
.sun::after{inset:-26px;border-color:rgba(245,215,110,.28);animation-duration:28s;animation-direction:reverse}
@keyframes raySpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.hero h1{position:relative;display:inline-block}
.hero h1::after{content:"";position:absolute;left:2px;right:2px;bottom:-6px;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--accent),#8fd19a,var(--accent));background-size:200% 100%;animation:progressShimmer 2.6s linear infinite;opacity:.75}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(255,255,255,.25) 60%);border:1px solid rgba(255,255,255,.7);z-index:1;pointer-events:none;animation:bubbleRise linear infinite;opacity:0}
.bubble.b1{left:14%;bottom:8px;width:14px;height:14px;animation-duration:7s}
.bubble.b2{left:30%;bottom:4px;width:9px;height:9px;animation-duration:9s;animation-delay:1.6s}
.bubble.b3{left:66%;bottom:10px;width:17px;height:17px;animation-duration:8s;animation-delay:.8s}
.bubble.b4{left:82%;bottom:6px;width:10px;height:10px;animation-duration:10s;animation-delay:3s}
@keyframes bubbleRise{0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}12%{opacity:.85}55%{transform:translateY(-120px) translateX(10px) scale(1)}100%{transform:translateY(-230px) translateX(-8px) scale(1.08);opacity:0}}
.butterfly{position:absolute;z-index:2;font-size:18px;pointer-events:none;animation:butterflyFly 16s ease-in-out infinite}
@keyframes butterflyFly{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(52px,-26px) rotate(10deg)}50%{transform:translate(110px,4px) rotate(-6deg)}75%{transform:translate(56px,22px) rotate(12deg)}100%{transform:translate(0,0) rotate(-8deg)}}
.firefly{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff7ae;box-shadow:0 0 10px 3px rgba(255,240,150,.65);z-index:1;pointer-events:none;animation:fireflyFloat 6s ease-in-out infinite}
@keyframes fireflyFloat{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(14px,-16px);opacity:1}}
.leaf.l5{left:26%;top:-10px;animation-duration:13s;animation-delay:3.5s;font-size:18px}
.leaf.l6{left:58%;top:-10px;animation-duration:16s;animation-delay:7s;font-size:13px}
.countdown .cd{position:relative;overflow:hidden}
.countdown .cd::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(143,209,154,.35) 50%,transparent 70%);transform:translateX(-120%);animation:cdShine 4.5s ease-in-out infinite}
.cd:nth-child(2)::after{animation-delay:.6s}.cd:nth-child(3)::after{animation-delay:1.2s}.cd:nth-child(4)::after{animation-delay:1.8s}
@keyframes cdShine{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.hero-meta span{animation:metaPop .6s cubic-bezier(.22,1,.36,1) both,metaFloat 5s ease-in-out infinite}
.hero-meta span:nth-child(2){animation-delay:.12s,.9s}.hero-meta span:nth-child(3){animation-delay:.24s,1.8s}
@keyframes metaFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.day-panel.active .tl::before{transform-origin:top;animation:lineGrow 1.1s cubic-bezier(.22,1,.36,1) both}
@keyframes lineGrow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:.45}}
.reveal.in{animation:fadeUpRich .65s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUpRich{0%{opacity:0;transform:translateY(18px) scale(.97) rotate(.4deg);filter:blur(2px)}60%{filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
.stop{overflow:visible}
.stop::after{content:"";position:absolute;left:-27.5px;top:17px;width:19px;height:19px;border-radius:50%;border:2px solid rgba(58,138,74,.5);animation:dotRipple 2.2s ease-out infinite;pointer-events:none}
.stop.meal::after{border-color:rgba(169,113,79,.5)}
.stop.stay::after{border-color:rgba(122,154,91,.55)}
@keyframes dotRipple{0%{transform:scale(.45);opacity:.9}70%{transform:scale(1.25);opacity:0}100%{transform:scale(1.25);opacity:0}}
.card,.flight{position:relative;overflow:hidden}
.card::after,.flight::after{content:"";position:absolute;top:0;bottom:0;left:0;width:55%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-160%) skewX(-14deg);pointer-events:none}
@media(hover:hover){.card:hover::after,.flight:hover::after{animation:shineSweep .8s ease forwards}}
@keyframes shineSweep{to{transform:translateX(260%) skewX(-14deg)}}
section.block>h2{position:relative;padding-bottom:7px}
section.block>h2::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:52px;border-radius:99px;background:linear-gradient(90deg,var(--accent),#8fd19a);animation:h2Pulse 3s ease-in-out infinite}
@keyframes h2Pulse{0%,100%{width:52px;opacity:.85}50%{width:84px;opacity:1}}
.wx-card{position:relative;overflow:hidden}
.wx-card::before{content:"";position:absolute;inset:auto -20% -55% -20%;height:70%;background:radial-gradient(ellipse at center,rgba(143,209,154,.28),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
@media(hover:hover){.wx-card:hover::before{opacity:1}}
.wx-card .wx-icon{filter:drop-shadow(0 4px 6px rgba(37,107,51,.18))}
.daybtn{position:relative;overflow:hidden}
.daybtn.active{animation:dayPop .35s cubic-bezier(.22,1,.36,1),dayGlow 2.4s ease-in-out infinite}
@keyframes dayGlow{0%,100%{box-shadow:0 6px 16px rgba(58,138,74,.30)}50%{box-shadow:0 6px 24px rgba(58,138,74,.55)}}
.progress i{box-shadow:0 0 10px rgba(58,138,74,.55)}
details .body{animation:detailsIn .35s cubic-bezier(.22,1,.36,1)}
@keyframes detailsIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
summary{transition:background .25s,color .25s}
@media(hover:hover){summary:hover{background:var(--accent-soft);color:var(--accent-dark)}}
.checklist li{transition:background .25s,transform .2s;border-radius:6px;padding-left:6px;padding-right:6px}
.checklist li:active{transform:scale(.99)}
.checklist li.done .txt{animation:doneStrike .3s ease}
@keyframes doneStrike{0%{opacity:.4}100%{opacity:1}}
.check-burst{position:absolute;font-size:13px;pointer-events:none;animation:burstFly .7s ease-out forwards;z-index:5}
@keyframes burstFly{0%{transform:translate(0,0) scale(.6) rotate(0deg);opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(1.15) rotate(120deg);opacity:0}}
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:45%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-180%) skewX(-14deg);animation:shineSweep 3.2s ease-in-out infinite}
.scene-tag{box-shadow:0 4px 14px rgba(0,0,0,.22)}
.island-svg{animation:sceneBreath 7s ease-in-out infinite}
@keyframes sceneBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
.topbtn{box-shadow:0 8px 20px rgba(37,107,51,.35)}
section.block{margin-top:38px}
section.block>h2{font-size:18.5px;margin:0 0 6px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
section.block>p.lead{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card+.card{margin-top:12px}
.card h3{margin:0 0 8px;font-size:15.5px;font-weight:700;letter-spacing:.03em}
.card p,.card li{font-size:14.5px}
.card ul{margin:6px 0;padding-left:20px}
.card li{margin:4px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)} .kv b{text-align:right;font-weight:600}
.alert{border:1px solid var(--line);background:var(--clay-soft);border-radius:var(--radius);padding:14px 16px;font-size:14.5px;line-height:1.75}
.alert b{color:var(--clay)}
details{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
details+details{margin-top:10px}
summary{cursor:pointer;padding:14px 16px;font-weight:700;letter-spacing:.03em;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--accent);font-size:16px;transition:transform .25s}
details[open ] summary::after{transform:rotate(45deg)}
details .body{padding:0 16px 14px;font-size:14.5px;color:var(--muted);line-height:1.75}
details .body b{color:var(--ink)}
.price-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.price-row span{min-width:0;overflow-wrap:break-word}
.price-row{flex-wrap:wrap}
.price-row b{margin-left:auto}
.price-row:last-child{border:none}
.price-row b{color:var(--clay);white-space:nowrap;font-weight:600}
.checklist{list-style:none;padding:0;margin:6px 0}
.checklist li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;align-items:flex-start;line-height:1.7}
.checklist li:last-child{border:none}
.checklist .box{flex-shrink:0;width:21px;height:21px;border:1.5px solid var(--accent);border-radius:3px;margin-top:3px;display:grid;place-items:center;color:transparent;font-size:12px;transition:all .2s}
.checklist li.done .box{background:var(--accent);color:#fff}
.checklist li.done .txt{color:var(--muted);text-decoration:line-through}
.checklist li{cursor:pointer}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:var(--radius);border:1px solid var(--accent);color:var(--accent-dark);background:var(--card);font-weight:600;letter-spacing:.04em;font-size:14px;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.04em;line-height:1.8}
.topbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:44px;height:44px;border-radius:var(--radius);border:1px solid var(--accent-dark);background:var(--accent-dark);color:#ffffff;font-size:17px;cursor:pointer;opacity:.92;transition:opacity .3s}
.topbtn:active{opacity:1}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:clip}
button,a,summary,.checklist li,.daybtn,.wx-card{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.checklist li{position:relative}
.day-panel,section.block{scroll-margin-top:86px}
svg,img{max-width:100%}
@media(max-width:640px){
.wrap{padding:0 16px 88px}
.daynav{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
.hero-inner{padding:32px 16px 0}
.hero h1{font-size:27px}
.hero p.sub{font-size:14px}
.sun{width:46px;height:46px;right:18px;top:24px}
.sun::before{inset:-12px}.sun::after{inset:-20px}
.countdown{gap:6px}
.cd{min-width:0;padding:9px 2px}
.cd b{font-size:20px}
.bubble.b2,.bubble.b4,.firefly.f3{display:none}
.butterfly{font-size:15px;animation-name:butterflyFlyS}
.leaf.l3{font-size:20px}
.stop{padding:14px 14px}
.stop p{font-size:14px}
.daybtn{min-height:52px}
.wx-card{min-height:118px}
.checklist li{padding-top:12px;padding-bottom:12px}
.btnrow .btn{flex:1 1 100%;justify-content:center}
.topbtn{width:48px;height:48px}
}
@keyframes butterflyFlyS{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(26px,-18px) rotate(10deg)}50%{transform:translate(54px,2px) rotate(-6deg)}75%{transform:translate(28px,14px) rotate(12deg)}100%{transform:translate(0,0) rotate(-8deg)}}
body.gate-locked{overflow:hidden}
.gate{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.gate[hidden]{display:none}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px 24px;max-width:380px;width:100%;box-shadow:0 12px 32px rgba(37,107,51,.14);text-align:center}
.gate-card h2{margin:0;font-size:26px;line-height:1.3;font-weight:800;letter-spacing:.08em;color:var(--ink)}
.gate-card p{margin:12px 0 0;font-size:15px;color:var(--muted);line-height:1.7}
.gate-form{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.gate-input{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);font:inherit;font-size:17px;text-align:center;letter-spacing:.06em;outline:none}
.gate-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gate-input::placeholder{color:var(--muted);font-size:15px;letter-spacing:.02em}
.gate-btn{width:100%;min-height:52px;border:1px solid var(--accent-dark);border-radius:var(--radius);background:var(--accent-dark);color:#fff;font:inherit;font-size:16px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.gate-btn:active{transform:scale(.98)}
.gate-error{min-height:24px;margin:4px 0 0;font-size:14px;color:#b42318;font-weight:600;line-height:1.6}
@media (prefers-color-scheme: dark){.gate-error{color:#fda29b}}
.gate-card.shake{animation:gateShake .4s ease}
@keyframes gateShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
html{scroll-behavior:auto}
.reveal.in{animation:none}
}

<script>
function initApp(){

var btns=document.querySelectorAll('.daybtn'), panels=document.querySelectorAll('.day-panel'), bar=document.getElementById('progress-bar');
function showDay(n){
btns.forEach(function(b){b.classList.toggle('active',b.dataset.day===String(n))});
panels.forEach(function(p){p.classList.toggle('active',p.dataset.panel===String(n))});
bar.style.width=(n*20)+'%';
var active=document.querySelector('.day-panel.active');
active.querySelectorAll('.reveal').forEach(function(el,i){ el.classList.remove('in'); setTimeout(function(){el.classList.add('in')}, 60*i+30); });
document.querySelector('.daynav').scrollIntoView({behavior:'smooth',block:'start'});
}
btns.forEach(function(b){ b.addEventListener('click',function(){ showDay(parseInt(b.dataset.day,10)); }); });
document.querySelectorAll('.wx-card').forEach(function(c){ c.addEventListener('click',function(){ showDay(parseInt(c.dataset.wxday,10)); }); });
(function(){
var map={'2026-11-23':1,'2026-11-24':2,'2026-11-25':3,'2026-11-26':4,'2026-11-27':5};
var now=new Date(), key=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
if(map[key]) showDay(map[key]);
})();
var target=new Date('2026-11-23T12:00:00+08:00').getTime();
function tick(){
var diff=target-Date.now(), d=document.getElementById('cd-d'),h=document.getElementById('cd-h'),m=document.getElementById('cd-m'),s=document.getElementById('cd-s');
if(diff<=0){ d.textContent='0';h.textContent='0';m.textContent='0';s.textContent='出發'; return; }
d.textContent=Math.floor(diff/86400000);
h.textContent=Math.floor(diff%86400000/3600000);
